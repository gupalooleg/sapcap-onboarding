_schema-version: 3.3.0
ID: onboarding
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: onboarding-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: onboarding-auth
      - name: onboarding-db
      - name: onboarding-destination

  - name: onboarding-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: onboarding-db

  - name: onboarding-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: onboardingcandidates
          artifacts:
            - candidates.zip
          target-path: app/
    requires:
      - name: onboarding-auth
      - name: srv-api
      - name: onboarding-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    parameters:
      config:
        destinations:
          - Name: srv-api
            URL: ~{srv-api/srv-url}
            Authentication: NoAuthentication
            Type: HTTP
            ProxyType: Internet
            ForwardAuthToken: true
            DynamicDestination: true

  - name: onboardingcandidates
    type: html5
    path: app/candidates
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

  - name: onboarding-destinations
    type: com.sap.application.content
    requires:
      - name: onboarding-auth
        parameters:
          service-key:
            name: onboarding-auth-key
      - name: onboarding-html5-repo-host
        parameters:
          service-key:
            name: onboarding-html5-repo-host-key
      - name: srv-api
      - name: onboarding-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        subaccount:
          existing_destinations_policy: update
          destinations:
            - Name: onboarding-html5-repository
              ServiceInstanceName: onboarding-html5-repo-host
              ServiceKeyName: onboarding-html5-repo-host-key
              sap.cloud.service: onboarding.service
            - Name: onboarding-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: onboarding-auth
              ServiceKeyName: onboarding-auth-key
              sap.cloud.service: onboarding.service

resources:
  - name: onboarding-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: onboarding-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
        role-collections:
          - name: 'CandidateAdministrator (onboarding ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.CandidateAdministrator'
          - name: 'CandidateViewer (onboarding ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.CandidateViewer'
  - name: onboarding-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: onboarding-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
    requires:
      - name: srv-api

  - name: onboarding-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
